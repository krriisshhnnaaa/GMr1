services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailautomation
      POSTGRES_USER: mailautomation
      POSTGRES_PASSWORD: mailautomation
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  postgres_data:
